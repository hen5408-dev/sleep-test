<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平衡衣測試 ｜ ISI 睡眠評估</title>
<style>
  :root{
    --ink:#1B2340;
    --ink-soft:#4A5178;
    --dawn-deep:#E56F4A;
    --mist:#F4F6FB;
    --card:#FFFFFF;
    --teal:#4C9A8E;
    --line:#DFE3EF;
    --ok:#4C9A8E;
    --warn:#E3A93B;
    --danger:#D9553F;
    --severe:#B33A2E;
    --font-display:'Fraunces', Georgia, 'Noto Serif TC', serif;
    --font-body:'Manrope','PingFang TC','Microsoft JhengHei',sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--mist);color:var(--ink);font-family:var(--font-body);}
  #app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .hero{
    position:relative;
    background:linear-gradient(135deg,#1B2340 0%,#2B3466 55%,#3B3E7A 100%);
    color:#fff;
    padding:36px 28px 54px;
    overflow:hidden;
  }
  .hero h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(29.04px,5.28vw,39.6px);
    margin:0 0 6px;
    letter-spacing:.2px;
  }
  .hero p{margin:0;color:#C3C8E8;font-size:18.48px;line-height:1.6;}
  .wave{position:absolute;left:0;right:0;bottom:-1px;height:46px;}
  .wave svg{width:100%;height:100%;display:block;}

  main{padding:24px 20px 0;}

  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;margin-bottom:18px;
    margin-top:-30px;position:relative;z-index:2;
    box-shadow:0 8px 24px rgba(27,35,64,.12);
  }
  .card h2{font-family:var(--font-display);font-size:25.08px;margin:0 0 4px;}
  .card .sub{color:var(--ink-soft);font-size:17.16px;margin:0 0 18px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}

  label.field{display:block;margin-bottom:14px;}
  label.field span.lbl{display:block;font-size:17.16px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  input[type=text],input[type=date],textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-family:var(--font-body);font-size:18.48px;color:var(--ink);background:#fff;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}

  fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;margin:0 0 14px;}
  fieldset legend{font-size:17.16px;font-weight:700;padding:0 6px;color:var(--ink);}
  .opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .opt{flex:1;min-width:90px;position:relative;}
  .opt input{position:absolute;opacity:0;}
  .opt label{
    display:block;text-align:center;padding:8px 6px;border-radius:8px;
    border:1px solid var(--line);font-size:16.5px;color:var(--ink-soft);cursor:pointer;
    transition:all .12s;
  }
  .opt input:checked + label{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* multi-select checkbox pills */
  .check-row{display:flex;flex-wrap:wrap;gap:10px;}
  .check{position:relative;}
  .check input{position:absolute;opacity:0;}
  .check label{
    display:block;padding:14px 22px;border-radius:999px;
    border:2px solid transparent;font-size:19.8px;font-weight:700;cursor:pointer;
    transition:all .12s;
  }
  .check--1 label{background:#DDF0EB;border-color:#4C9A8E;color:#2E6D5F;}
  .check--2 label{background:#FBEBC9;border-color:#E3A93B;color:#8A6417;}
  .check--3 label{background:#F2DFEC;border-color:#B85C9E;color:#7A3F68;}
  .check input:checked + label{color:#fff;}
  .check--1 input:checked + label{background:#4C9A8E;border-color:#4C9A8E;}
  .check--2 input:checked + label{background:#E3A93B;border-color:#E3A93B;}
  .check--3 input:checked + label{background:#B85C9E;border-color:#B85C9E;}

  .stage-row{display:flex;gap:12px;flex-wrap:wrap;}
  .stage-btn{
    flex:1;min-width:150px;padding:14px;border-radius:12px;
    border:2px solid var(--line);background:#fff;color:var(--ink-soft);
    font-family:var(--font-body);cursor:pointer;transition:all .15s;
    text-align:center;
  }
  .stage-btn .stage-main{display:block;font-weight:700;font-size:19.14px;}
  .stage-btn .stage-sub{display:block;font-size:15.18px;font-weight:500;margin-top:3px;opacity:.75;}
  .stage-btn:hover{border-color:var(--teal);color:var(--ink);}
  .stage-btn.active{border-color:var(--ink);background:var(--ink);color:#fff;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;font-weight:700;font-size:18.48px;cursor:pointer;
    font-family:var(--font-body);
  }
  .btn:hover{background:#2A335C;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}

  .msg{padding:12px 14px;border-radius:9px;font-size:17.82px;margin-bottom:14px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:#FDECEA;color:var(--danger);border:1px solid #F4C2BA;}
  .msg.success{background:#EAF5F1;color:#2E6D5F;border:1px solid #BFE3D6;}

  .gauge-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .gauge{width:120px;height:120px;flex-shrink:0;}
  .gauge-text{font-family:var(--font-display);font-size:44.88px;font-weight:600;}
  .band-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:15.84px;font-weight:700;color:#fff;}

  .required:after{content:" *";color:var(--dawn-deep);}
  .hint{font-size:15.84px;color:var(--ink-soft);margin:-8px 0 14px;}
</style>
</head>
<body>
<div id="app">

  <div class="hero">
    <h1>平衡衣測試 ｜ ISI 睡眠評估</h1>
    <p>ISI 失眠嚴重度量表（前測／後測），作答後自動計算分數並送出至後台。</p>
    <div class="wave">
      <svg viewBox="0 0 800 60" preserveAspectRatio="none">
        <path d="M0,40 C100,10 150,10 250,40 C350,70 400,70 500,40 C600,10 650,10 750,40 C780,50 800,45 800,45 L800,60 L0,60 Z" fill="#F4F6FB"/>
      </svg>
    </div>
  </div>

  <main>
    <div class="card">
      <h2>ISI 失眠嚴重度量表</h2>
      <p class="sub">共 7 題，作答後自動計算 0–28 分並顯示失眠程度。前測、後測共用同一份表單。</p>
      <div class="msg" id="isi-msg"></div>

      <div class="grid2">
        <label class="field">
          <span class="lbl required">姓名</span>
          <input type="text" id="isi-name" placeholder="例：王小明 / T003">
        </label>
        <label class="field">
          <span class="lbl required">填寫日期</span>
          <input type="date" id="isi-date">
        </label>
      </div>

      <div class="field">
        <span class="lbl required">測試階段</span>
        <div class="stage-row" id="isi-stage-group">
          <button type="button" class="stage-btn" data-stage="前測" id="stage-pre">
            <span class="stage-main">前測</span>
            <span class="stage-sub">尚未穿平衡衣睡覺</span>
          </button>
          <button type="button" class="stage-btn" data-stage="後測" id="stage-post">
            <span class="stage-main">後測</span>
            <span class="stage-sub">穿平衡衣一週左右</span>
          </button>
        </div>
      </div>

      <fieldset>
        <legend class="required">您平常睡眠困難是屬於哪一類型？（可複選）</legend>
        <div class="check-row" id="isi-sleeptype-group">
          <div class="check check--1"><input type="checkbox" value="難入睡" id="st-1"><label for="st-1">難入睡</label></div>
          <div class="check check--2"><input type="checkbox" value="多夢/淺眠" id="st-2"><label for="st-2">多夢/淺眠</label></div>
          <div class="check check--3"><input type="checkbox" value="早醒難再入睡" id="st-3"><label for="st-3">早醒難再入睡</label></div>
        </div>
      </fieldset>

      <div id="isi-questions"></div>

      <label class="field" id="isi-feeling-wrap" style="display:none;">
        <span class="lbl required">穿著一週後的整體感受</span>
        <textarea id="isi-feeling" placeholder="請描述穿著平衡衣期間的睡眠或身體感受變化"></textarea>
      </label>

      <button class="btn" id="isi-submit">送出</button>
    </div>

    <div class="card" id="isi-result-card" style="display:none;">
      <h2>本次評估結果</h2>
      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 120 120" id="isi-gauge"></svg>
        <div>
          <div class="gauge-text" id="isi-score-text">0</div>
          <div style="color:var(--ink-soft);font-size:16.5px;margin-bottom:6px;">總分（0–28）</div>
          <span class="band-tag" id="isi-band-tag">—</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // 部署設定：把下面換成你部署 Google Apps Script 網頁應用程式後拿到的網址
  // 例如：https://script.google.com/macros/s/AKfycb.../exec
  // ============================================================
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_gvl56JjyGqVyoebeskU9jBbpXFNNNIn9khkhm3Tsavf-h06xdLWDnGFUw33ECbPYZg/exec';

  const NOT_CONFIGURED = !SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0;
  if (NOT_CONFIGURED) {
    const warn = document.createElement('div');
    warn.style.cssText = 'background:#D9553F;color:#fff;padding:12px 20px;font-size:17.82px;text-align:center;';
    warn.textContent = '尚未設定 SCRIPT_URL：請在 index.html 中把 Google Apps Script 網頁應用程式網址填入，否則資料無法送出。';
    document.body.insertBefore(warn, document.body.firstChild);
  }

  async function apiPost(action, extra){
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({action}, extra))
    });
    if(!res.ok) throw new Error('network error '+res.status);
    return res.json();
  }

  const $ = id => document.getElementById(id);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
  $('isi-date') && ($('isi-date').value = new Date().toISOString().slice(0,10));

  function showMsg(el, text, type){
    el.textContent = text;
    el.className = 'msg show ' + type;
    setTimeout(()=>{ el.classList.remove('show'); }, 5000);
  }

  // ---------- ISI question definitions ----------
  const ISI_QUESTIONS = [
    { key:'q1', text:'1. 難以「入睡」的困難程度', opts:['無','輕度','中度','重度','非常嚴重'] },
    { key:'q2', text:'2. 難以「維持睡眠」的困難程度（多夢/淺眠）', opts:['無','輕度','中度','重度','非常嚴重'] },
    { key:'q3', text:'3. 「過早醒來」的困難程度', opts:['無','輕度','中度','重度','非常嚴重'] },
    { key:'q4', text:'4. 對目前睡眠型態的滿意程度', opts:['非常滿意','滿意','普通','不滿意','非常不滿意'] },
    { key:'q5', text:'5. 睡眠問題對日常生活品質的干擾程度（他人是否看得出來）', opts:['完全不會','一點點','有些','很多','非常多'] },
    { key:'q6', text:'6. 對目前睡眠問題感到擔心／苦惱的程度', opts:['完全不會','一點點','有些','很多','非常多'] },
    { key:'q7', text:'7. 睡眠問題對日常生活功能（精神、情緒、專注力等）造成干擾的程度', opts:['完全不會','一點點','有些','很多','非常多'] },
  ];

  const qContainer = $('isi-questions');
  ISI_QUESTIONS.forEach(q=>{
    const fs = document.createElement('fieldset');
    const legend = document.createElement('legend');
    legend.className = 'required';
    legend.textContent = q.text;
    fs.appendChild(legend);
    const row = document.createElement('div');
    row.className = 'opt-row';
    q.opts.forEach((label,i)=>{
      const wrap = document.createElement('div');
      wrap.className = 'opt';
      const id = q.key+'-'+i;
      wrap.innerHTML = `<input type="radio" name="${q.key}" value="${i}" id="${id}"><label for="${id}">${i}．${label}</label>`;
      row.appendChild(wrap);
    });
    fs.appendChild(row);
    qContainer.appendChild(fs);
  });

  let selectedStage = null;
  document.querySelectorAll('.stage-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.stage-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      selectedStage = btn.dataset.stage;
      $('isi-feeling-wrap').style.display = selectedStage === '後測' ? 'block' : 'none';
    });
  });
  function resetStageButtons(){
    document.querySelectorAll('.stage-btn').forEach(b=>b.classList.remove('active'));
    selectedStage = null;
  }

  function getISIBand(score){
    if(score<=7) return {label:'無臨床顯著失眠', color:'ok'};
    if(score<=14) return {label:'輕度失眠（閾下）', color:'warn'};
    if(score<=21) return {label:'中度臨床失眠', color:'danger'};
    return {label:'重度臨床失眠', color:'severe'};
  }

  function drawGauge(score){
    const svg = $('isi-gauge');
    const pct = score/28;
    const r = 50, cx=60, cy=60;
    const circumference = 2*Math.PI*r;
    const offset = circumference * (1-pct);
    const band = getISIBand(score);
    const tmp = getComputedStyle(document.documentElement);
    const colorMap = {ok:tmp.getPropertyValue('--ok'),warn:tmp.getPropertyValue('--warn'),danger:tmp.getPropertyValue('--danger'),severe:tmp.getPropertyValue('--severe')};
    const strokeColor = colorMap[band.color];
    svg.innerHTML = `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E7EAF4" stroke-width="12"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${strokeColor}"
        stroke-width="12" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${cx} ${cy})"/>
    `;
    $('isi-score-text').textContent = score;
    $('isi-band-tag').textContent = band.label;
    $('isi-band-tag').style.background = strokeColor;
  }

  $('isi-submit').addEventListener('click', async ()=>{
    const msgEl = $('isi-msg');
    if(NOT_CONFIGURED){ showMsg(msgEl,'尚未設定後台網址（SCRIPT_URL），無法送出','error'); return; }
    const name = $('isi-name').value.trim();
    const date = $('isi-date').value;
    const stage = selectedStage;

    if(!name){ showMsg(msgEl,'請輸入姓名或測試編號','error'); return; }
    if(!date){ showMsg(msgEl,'請選擇填寫日期','error'); return; }
    if(!stage){ showMsg(msgEl,'請選擇測試階段（前測／後測）','error'); return; }

    const sleepTypeChecks = Array.from(document.querySelectorAll('#isi-sleeptype-group input:checked')).map(c=>c.value);
    if(sleepTypeChecks.length === 0){ showMsg(msgEl,'請選擇平常睡眠困難的類型（可複選）','error'); return; }

    const answers = {};
    for(const q of ISI_QUESTIONS){
      const sel = document.querySelector(`input[name="${q.key}"]:checked`);
      if(!sel){ showMsg(msgEl,'請完成全部 7 題後再送出','error'); return; }
      answers[q.key] = Number(sel.value);
    }

    let feeling = '';
    if(stage === '後測'){
      feeling = $('isi-feeling').value.trim();
      if(!feeling){ showMsg(msgEl,'後測請填寫一週穿著感受','error'); return; }
    }

    const score = Object.values(answers).reduce((a,b)=>a+b,0);
    const band = getISIBand(score);
    const entry = Object.assign(
      { id: uid(), name, date, stage, sleepType: sleepTypeChecks.join('、'), score, level: band.label, feeling, submittedAt: new Date().toISOString() },
      answers
    );

    const submitBtn = $('isi-submit');
    submitBtn.disabled = true; submitBtn.textContent = '送出中…';
    try{
      const res = await apiPost('add-isi', {payload: entry});
      if(!res || !res.success) throw new Error(res && res.error || '儲存失敗');
      showMsg(msgEl, '已送出，感謝填寫！', 'success');
      drawGauge(score);
      $('isi-result-card').style.display = 'block';
      document.querySelectorAll('input[name^="q"]').forEach(r=>r.checked=false);
      document.querySelectorAll('#isi-sleeptype-group input').forEach(c=>c.checked=false);
      resetStageButtons();
      $('isi-feeling').value = '';
      $('isi-feeling-wrap').style.display = 'none';
    }catch(e){
      console.error(e);
      showMsg(msgEl, '儲存失敗，請檢查網路或後台設定後重試', 'error');
    }finally{
      submitBtn.disabled = false; submitBtn.textContent = '送出';
    }
  });

})();
</script>
</body>
</html>
